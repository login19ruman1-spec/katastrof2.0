name: DisasterPanel
version: 2.0.0
main: dev.disasterpanel.DisasterPanel
api-version: 1.21
author: DisasterPanel Team
description: Реалистичная система управления катастрофами с красивым GUI

commands:
  disaster:
    description: Открыть панель управления катастрофами
    usage: /disaster
    permission: disasterpanel.admin
    aliases: [dp, катастрофа]

permissions:
  disasterpanel.admin:
    description: Доступ к панели управления катастрофами
    default: op
